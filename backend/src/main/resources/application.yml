# Ortak yapılandırma. Gizli değerler YALNIZCA ortam değişkenlerinden okunur;
# bu dosyada parola, anahtar veya üretim adresi bulunmaz.
spring:
  application:
    name: sosyal-backend
  autoconfigure:
    # Kullanıcılar veritabanından doğrulanacak (Aşama 2). Spring'in rastgele parolalı
    # bellek içi varsayılan kullanıcısının oluşturulmasını ve loglanmasını engeller.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Şema yalnızca Flyway ile değişir
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: false
  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  auth:
    # Base64 kodlu, en az 32 baytlık HMAC anahtarı. Üretmek için: openssl rand -base64 48
    jwt-secret: ${JWT_SECRET:}
    access-token-ttl: 15m
    refresh-token-ttl: 30d

logging:
  level:
    root: INFO
