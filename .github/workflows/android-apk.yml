name: Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  # İndirilen APK'nın bağlanacağı API adresi, depo ayarlarındaki değişkenden okunur
  # (Settings -> Secrets and variables -> Actions -> Variables -> SOSYAL_API_BASE_URL).
  # Depo herkese açık olduğu için sunucu adresi koda yazılmaz. Tanımlı değilse APK
  # emülatör adresini (10.0.2.2) kullanır.
  SOSYAL_API_BASE_URL: ${{ vars.SOSYAL_API_BASE_URL }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Debug APK derle
        run: ./gradlew assembleDebug -Psosyal.apiBaseUrl="$SOSYAL_API_BASE_URL" --stacktrace

      - name: Birim testleri
        run: ./gradlew testDebugUnitTest

      - uses: actions/upload-artifact@v4
        with:
          name: sosyal-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: android/app/build/reports/
          retention-days: 7
