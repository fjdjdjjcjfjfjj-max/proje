# Üretim / test sunucusu kurulumu.
# Kullanım (sunucuda, depo kökünde):
#   docker compose -f infra/prod/docker-compose.yml --env-file infra/prod/.env up -d --build
#
# Dışarıya yalnızca Caddy açılır (80/443). Backend ve PostgreSQL hiçbir host portuna
# bağlanmaz; yalnızca iç Docker ağında birbirine erişir. (Docker'ın yayınladığı portlar
# ufw kurallarını atlayabildiği için bu önemlidir.)
name: sosyal

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sosyal}
      POSTGRES_USER: ${POSTGRES_USER:-sosyal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?infra/prod/.env icinde POSTGRES_PASSWORD tanimlayin}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ../../backend
    image: sosyal-backend:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sosyal}
      DB_USERNAME: ${POSTGRES_USER:-sosyal}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://${API_DOMAIN}}
    networks: [internal, edge]

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?infra/prod/.env icinde API_DOMAIN tanimlayin}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]

networks:
  internal:
    internal: true   # İnternete çıkışı olmayan ağ: yalnızca backend <-> postgres
  edge:

volumes:
  pgdata:
  caddy_data:
  caddy_config:
